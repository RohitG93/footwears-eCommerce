@if (product) {
    <mat-card appearance="raised">
        <img mat-card-image src="{{product.pictureUrl}}" routerLink="/shop/{{product.id}}" class="product-card"
        alt="{{product.name}}" style="object-fit: cover; width: 100%; height: 300px;">
        <mat-card-content>
            <h2 class="text-sm font-semibold uppercase">{{product.name}}</h2>
            <p class="font-light">{{product.price | currency}}</p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-stroked-button class="w-full">
                <mat-icon>add_shopping_cart</mat-icon>
                Add to Cart
            </button>
        </mat-card-actions>
    </mat-card>
}
