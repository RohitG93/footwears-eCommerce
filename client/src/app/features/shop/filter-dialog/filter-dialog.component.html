<div>
    <h3 class="text-3xl text-center font-semibold mb-4">Filters</h3>
    <mat-divider></mat-divider>
    <div class="flex p-4">
        <div class="w-1/2">
            <h4 class="text-lg font-semibold mb-2">Brands</h4>
            <mat-selection-list [(ngModel)]="selectedBrands" [multiple]="true">
                @for (brand of this.shopService.brandsList; track $index) {
                    <mat-list-option [value]="brand">
                        {{ brand }}
                    </mat-list-option>
            }
            </mat-selection-list>
            
        </div>
        <div class="w-1/2">
            <h4 class="text-lg font-semibold mb-2">Types</h4>
            <mat-selection-list [(ngModel)]="selectedTypes" [multiple]="true">
                @for (type of this.shopService.typesList; track $index) {
                    <mat-list-option [value]="type">
                        {{ type }}
                    </mat-list-option>
            }
            </mat-selection-list>
        </div>
    </div>
    <div class="flex justify-end p-4">
        <button mat-flat-button color="primary" (click)="applyFilters()">Apply Filters</button>
    </div>
</div>
