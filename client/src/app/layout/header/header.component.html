<header class="shadow-md p-3 w-full">
    <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
        <img routerLink="/" src="images/footWearLogo.jpg" alt="app logo" class="max-h-16" style="object-fit: cover; border-radius: 50%; height: 100px; width: 100px;">
        <nav class="flex gap-3 my-2 uppercase text-xl">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/shop" routerLinkActive="active">Shop</a>
            <a>Contact</a>
        </nav>
        <div class="flex gap-3 align-middle">
            <a routerLink="/cart" routerLinkActive="active" matBadge="{{cartService.itemCount()}}" matBadgeSize="large" class="custom-badge mt-2 mr-2">
                <mat-icon>add_shopping_cart</mat-icon>
            </a>
            @if (acctService.currentUser())
            {
                <button mat-button [matMenuTriggerFor]="menu">
                    <mat-icon>arrow_drop_down</mat-icon>
                    <span>{{acctService.currentUser()?.email}}</span>
                </button>
            }
            @else {
                <button routerLink="/account/login" matButton="outlined" class="custom-shadow-btn" style="background-color: rgb(140, 156, 162);">Login</button>
                <button routerLink="/account/register" matButton="outlined" class="custom-shadow-btn" style="background-color: rgb(140, 156, 162);">Register</button>
            }

        </div>

    </div>
</header>

<mat-menu #menu="matMenu" class="px-3">
    <button mat-menu-item routerLink="/cart">
        <mat-icon>shopping_cart</mat-icon>
        My cart
    </button>
    <button mat-menu-item routerLink="/orders">
        <mat-icon>history</mat-icon>
        View Orders
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="this.logOut()">
        <mat-icon>logout</mat-icon>
        Logout
    </button>
</mat-menu>
